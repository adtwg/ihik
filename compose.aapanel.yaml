x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Mode aaPanel (Opsi 2): TLS diterminasi Nginx aaPanel yang memiliki port 80/443.
# Gateway Caddy hanya bind 127.0.0.1:8090 agar tidak bentrok dengan Nginx.
# Pakai: docker compose -f compose.aapanel.yaml <perintah>  (deploy-safe.sh sudah otomatis).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?sslmode=disable
      DATABASE_RUNTIME_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env}
      DATABASE_RUNTIME_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_PORT: 8080
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      DATABASE_URL: postgres://${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env}:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - edge
      - backend
    logging: *default-logging

  web:
    build:
      context: web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - edge
    logging: *default-logging

  gateway:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile.aapanel:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
